[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "humanity-os"
version = "0.1.0"
description = "Local-first personal knowledge and intelligence workspace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License to be selected; see LICENSE-DECISION.md" }
dependencies = ["argon2-cffi>=23.1,<26", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
humanity-os = "humanity_os.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/humanity_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
