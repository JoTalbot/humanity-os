name: CI

on:
  pull_request:
    branches: [main, "foundation/**", "security/**", "personal-core/**", "humanity-one/**"]
  push:
    branches: [main, "foundation/**", "security/**", "personal-core/**", "humanity-one/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check browser JavaScript syntax
        run: node --check src/humanity_os/static/app.js
      - name: Test
        run: pytest
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0" pip-audit
          pip-audit
