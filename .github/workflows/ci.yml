name: CI

on:
  pull_request:
    branches: [main, "foundation/**", "security/**", "personal-core/**", "humanity-one/**", "integration/**"]
  push:
    branches: [main, "foundation/**", "security/**", "personal-core/**", "humanity-one/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0" pip-audit
          pip-audit
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --wheel --sdist --outdir "$RUNNER_TEMP/humanity-os-dist"
      - name: Verify distribution contents
        env:
          DIST_DIR: ${{ runner.temp }}/humanity-os-dist
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          from zipfile import ZipFile

          output = Path(os.environ["DIST_DIR"])
          wheels = list(output.glob("*.whl"))
          sdists = list(output.glob("*.tar.gz"))
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"expected one sdist, found {sdists}"

          package_files = (
              "humanity_os/cli.py",
              "humanity_os/app.py",
              "humanity_os/static/index.html",
              "humanity_os/static/app.js",
              "humanity_os/static/styles.css",
          )
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              missing = set(package_files) - names
              assert not missing, f"wheel is missing required files: {sorted(missing)}"
              entry_points = [
                  name for name in names
                  if name.endswith(".dist-info/entry_points.txt")
              ]
              assert len(entry_points) == 1, "wheel must contain one entry_points.txt"
              metadata = wheel.read(entry_points[0]).decode("utf-8")
              assert "humanity-os = humanity_os.cli:main" in metadata, metadata

          with tarfile.open(sdists[0], "r:gz") as sdist:
              names = set(sdist.getnames())
              missing = {
                  path for path in (f"src/{item}" for item in package_files)
                  if not any(name == path or name.endswith(f"/{path}") for name in names)
              }
              assert not missing, f"sdist is missing required files: {sorted(missing)}"

          print("Wheel and sdist contain the application, CLI entry point, and all UI assets.")
          PY
      - name: Install wheel in isolated target and smoke-test packaged app
        env:
          DIST_DIR: ${{ runner.temp }}/humanity-os-dist
          INSTALL_DIR: ${{ runner.temp }}/humanity-os-wheel-install
        run: |
          python -m pip install --no-deps --target "$INSTALL_DIR" "$DIST_DIR"/*.whl
          PYTHONPATH="$INSTALL_DIR" python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from fastapi.testclient import TestClient
          from humanity_os.app import create_app

          package = Path(os.environ["INSTALL_DIR"]) / "humanity_os"
          for asset in ("index.html", "app.js", "styles.css"):
              assert (package / "static" / asset).is_file(), asset

          with TemporaryDirectory() as directory:
              app = create_app(str(Path(directory) / "smoke.sqlite3"))
              with TestClient(app) as client:
                  page = client.get("/")
                  assert page.status_code == 200, page.text
                  assert "HUMANITY" in page.text
                  for asset in ("app.js", "styles.css"):
                      response = client.get(f"/static/{asset}")
                      assert response.status_code == 200, asset

          print("Installed wheel imports, serves the workspace, and returns packaged UI assets.")
          PY
